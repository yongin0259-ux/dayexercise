<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>오늘의 무브</title>
<style>
  :root{
    color-scheme: light;
    --bg: #f9f9f7;
    --surface: #fcfcfb;
    --surface-2: #f2f1ec;
    --text-primary: #0b0b0b;
    --text-secondary: #52514e;
    --text-muted: #898781;
    --border: rgba(11,11,11,0.10);
    --border-strong: rgba(11,11,11,0.16);
    --grid: #e1e0d9;

    --accent: #eb6834;
    --accent-2: #f2a35f;
    --accent-ink: #ffffff;
    --blue: #2a78d6;
    --blue-bg: #e5eefb;
    --orange: #eb6834;
    --orange-bg: #fbe8de;
    --aqua: #1baf7a;
    --aqua-bg: #dff5ec;

    --shadow-1: 0 1px 2px rgba(11,11,11,.06), 0 8px 20px -12px rgba(11,11,11,.18);
    --shadow-2: 0 2px 6px rgba(11,11,11,.08), 0 16px 32px -16px rgba(11,11,11,.22);

    --header-h: 62px;
    --nav-h: 64px;
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      color-scheme: dark;
      --bg: #0d0d0d;
      --surface: #1a1a19;
      --surface-2: #232321;
      --text-primary: #ffffff;
      --text-secondary: #c3c2b7;
      --text-muted: #8f8d85;
      --border: rgba(255,255,255,0.10);
      --border-strong: rgba(255,255,255,0.18);
      --grid: #2c2c2a;

      --accent: #d95926;
      --accent-2: #8a3a16;
      --accent-ink: #ffffff;
      --blue: #3987e5;
      --blue-bg: rgba(57,135,229,0.16);
      --orange: #d95926;
      --orange-bg: rgba(217,89,38,0.18);
      --aqua: #199e70;
      --aqua-bg: rgba(25,158,112,0.18);

      --shadow-1: 0 1px 2px rgba(0,0,0,.4), 0 8px 20px -12px rgba(0,0,0,.5);
      --shadow-2: 0 2px 6px rgba(0,0,0,.4), 0 16px 32px -16px rgba(0,0,0,.6);
    }
  }
  :root[data-theme="dark"]{
    color-scheme: dark;
    --bg: #0d0d0d;
    --surface: #1a1a19;
    --surface-2: #232321;
    --text-primary: #ffffff;
    --text-secondary: #c3c2b7;
    --text-muted: #8f8d85;
    --border: rgba(255,255,255,0.10);
    --border-strong: rgba(255,255,255,0.18);
    --grid: #2c2c2a;

    --accent: #d95926;
    --accent-2: #8a3a16;
    --accent-ink: #ffffff;
    --blue: #3987e5;
    --blue-bg: rgba(57,135,229,0.16);
    --orange: #d95926;
    --orange-bg: rgba(217,89,38,0.18);
    --aqua: #199e70;
    --aqua-bg: rgba(25,158,112,0.18);

    --shadow-1: 0 1px 2px rgba(0,0,0,.4), 0 8px 20px -12px rgba(0,0,0,.5);
    --shadow-2: 0 2px 6px rgba(0,0,0,.4), 0 16px 32px -16px rgba(0,0,0,.6);
  }

  *{ box-sizing: border-box; }
  [hidden]{ display:none !important; }
  @media (prefers-reduced-motion: reduce){
    *, *::before, *::after{ animation-duration: .001ms !important; transition-duration: .001ms !important; }
  }

  html, body{ margin:0; padding:0; background: var(--bg); }
  body{
    color: var(--text-primary);
    font-family: "Manrope", system-ui, -apple-system, "Segoe UI", sans-serif;
    -webkit-tap-highlight-color: transparent;
    padding-top: env(safe-area-inset-top, 0px);
    padding-bottom: env(safe-area-inset-bottom, 0px);
  }

  h1,h2,h3{ margin:0; font-family: "Unbounded", "Manrope", system-ui, sans-serif; text-wrap: balance; }
  p{ margin:0; }
  button{ font-family: inherit; }
  input{ font-family: inherit; }
  button:focus-visible, input:focus-visible, [tabindex]:focus-visible{
    outline: 2px solid var(--blue);
    outline-offset: 2px;
  }

  .app{
    max-width: 480px;
    margin: 0 auto;
    padding-bottom: calc(var(--nav-h) + env(safe-area-inset-bottom, 0px) + 12px);
  }

  /* ---------- Top bar ---------- */
  .topbar{
    position: sticky;
    top: env(safe-area-inset-top, 0px);
    z-index: 20;
    display:flex; align-items:center; justify-content:space-between;
    gap: 12px;
    padding: 14px 18px;
    background: linear-gradient(135deg, var(--accent), var(--accent-2));
    color: #fff;
    box-shadow: var(--shadow-1);
  }
  .brand{ display:flex; align-items:center; gap:10px; }
  .brand-mark{
    width:34px; height:34px; border-radius:11px;
    background: rgba(255,255,255,.22);
    display:flex; align-items:center; justify-content:center;
    flex: none;
  }
  .brand-mark svg{ width:19px; height:19px; }
  .brand-text h1{ font-size: 16px; font-weight: 700; letter-spacing: .01em; color:#fff; line-height:1.1; }
  .brand-text p{ font-size: 11px; color: rgba(255,255,255,.85); margin-top:2px; }
  .streak-badge{
    display:flex; align-items:center; gap:5px;
    background: rgba(255,255,255,.22);
    border-radius: 999px;
    padding: 6px 11px 6px 8px;
    font-weight:700; font-size:13px; color:#fff;
    font-variant-numeric: tabular-nums;
    opacity:.55;
    transition: opacity .2s ease;
  }
  .streak-badge.active{ opacity:1; }
  .streak-badge svg{ width:15px; height:15px; }

  /* ---------- Views ---------- */
  .view{ padding: 16px 16px 4px; display:flex; flex-direction:column; gap:14px; }

  /* date / month nav */
  .date-nav, .month-nav{
    display:flex; align-items:center; justify-content:space-between;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 16px;
    padding: 6px 6px;
    box-shadow: var(--shadow-1);
  }
  .nav-arrow{
    width:36px; height:36px; border-radius:11px;
    border:none; background:transparent; color: var(--text-primary);
    display:flex; align-items:center; justify-content:center;
    cursor:pointer;
  }
  .nav-arrow svg{ width:18px; height:18px; }
  .nav-arrow:disabled{ opacity:.3; }
  .nav-arrow:not(:disabled):active{ background: var(--surface-2); }
  .date-label, .month-label{ font-weight:700; font-size:14.5px; }

  .today-progress{ display:flex; align-items:center; gap:10px; padding: 2px 4px; }
  .progress-track{ flex:1; height:8px; border-radius:999px; background: var(--surface-2); overflow:hidden; }
  .progress-fill{ height:100%; width:0%; border-radius:999px; background: linear-gradient(90deg, var(--blue), var(--aqua)); transition: width .35s cubic-bezier(.4,0,.2,1); }
  .progress-text{ font-size:12.5px; font-weight:700; color: var(--text-secondary); font-variant-numeric: tabular-nums; white-space:nowrap; }

  .today-jump{
    align-self:center;
    border:1px solid var(--border-strong); background: var(--surface);
    color: var(--blue); font-weight:700; font-size:12.5px;
    padding:6px 14px; border-radius:999px; cursor:pointer;
  }

  /* ---------- Card ---------- */
  .card{
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 20px;
    padding: 16px;
    box-shadow: var(--shadow-1);
    display:flex; flex-direction:column; gap:14px;
    position:relative;
  }
  .card-head{ display:flex; align-items:center; gap:12px; }
  .icon-badge{
    width:42px; height:42px; border-radius:14px;
    display:flex; align-items:center; justify-content:center;
    flex:none;
  }
  .icon-badge svg{ width:22px; height:22px; }
  .icon-blue{ background: var(--blue-bg); color: var(--blue); }
  .icon-orange{ background: var(--orange-bg); color: var(--orange); }
  .icon-aqua{ background: var(--aqua-bg); color: var(--aqua); }
  .card-title h3{ font-size: 15px; font-weight:700; color: var(--text-primary); }
  .card-title p{ font-size: 11.5px; color: var(--text-muted); margin-top:2px; }
  .card-title{ flex:1; min-width:0; }

  .done-badge{
    width:22px; height:22px; border-radius:999px; flex:none;
    display:flex; align-items:center; justify-content:center;
    background: var(--aqua); color:#fff;
    transition: transform .2s ease, opacity .2s ease;
  }
  .done-badge svg{ width:12px; height:12px; }
  .done-badge[hidden]{ display:none; }

  .metric-row{ display:flex; align-items:center; justify-content:center; gap:14px; }
  .stepper-btn{
    width:40px; height:40px; border-radius:12px; flex:none;
    border:1px solid var(--border-strong); background: var(--surface-2);
    color: var(--text-primary); font-size:20px; font-weight:700;
    display:flex; align-items:center; justify-content:center; cursor:pointer;
    line-height:1;
  }
  .stepper-btn:active{ background: var(--border-strong); }
  .metric-display{ display:flex; align-items:baseline; gap:5px; min-width:0; }
  .metric-input{
    width: 4.4ch; max-width:130px; border:none; background:transparent;
    color: var(--text-primary); font-family:"Unbounded","Manrope",sans-serif;
    font-weight:700; font-size:34px; text-align:center;
    -moz-appearance: textfield;
  }
  .metric-input::-webkit-outer-spin-button, .metric-input::-webkit-inner-spin-button{ -webkit-appearance:none; margin:0; }
  .metric-unit{ font-size:14px; font-weight:700; color: var(--text-muted); }

  .chip-row{ display:flex; gap:8px; flex-wrap:wrap; justify-content:center; }
  .chip{
    border:1px solid var(--border-strong); background: var(--surface-2);
    color: var(--text-secondary); font-weight:700; font-size:12.5px;
    padding:7px 13px; border-radius:999px; cursor:pointer;
  }
  .chip:active{ background: var(--border-strong); }

  .timer-row{ display:flex; align-items:center; justify-content:center; gap:10px; }
  .timer-btn{
    display:flex; align-items:center; gap:7px;
    border:1px solid var(--border-strong); background: var(--surface-2);
    color: var(--orange); font-weight:700; font-size:12.5px;
    padding:8px 14px; border-radius:999px; cursor:pointer;
  }
  .timer-btn svg{ width:13px; height:13px; }
  .timer-btn.running{ background: var(--orange); color:#fff; border-color: transparent; }
  .timer-display{
    font-variant-numeric: tabular-nums; font-weight:700; font-size:13px;
    color: var(--text-secondary);
  }

  .toggle-row{ display:flex; align-items:center; justify-content:space-between; gap:12px; }
  .toggle-label{ font-size:13.5px; font-weight:700; }
  .toggle-row .card-sub{ font-size:11.5px; color: var(--text-muted); margin-top:3px; }
  .toggle-switch{
    width:50px; height:29px; border-radius:999px; flex:none;
    border:1px solid var(--border-strong); background: var(--surface-2);
    position:relative; cursor:pointer;
    transition: background .2s ease, border-color .2s ease;
  }
  .toggle-switch .toggle-knob{
    position:absolute; top:2px; left:2px;
    width:23px; height:23px; border-radius:999px;
    background:#fff; box-shadow: 0 1px 3px rgba(0,0,0,.3);
    transition: transform .2s cubic-bezier(.4,0,.2,1);
  }
  .toggle-switch.on{ background: var(--aqua); border-color: var(--aqua); }
  .toggle-switch.on .toggle-knob{ transform: translateX(21px); }

  /* ---------- Stats ---------- */
  .stat-tiles{ display:grid; grid-template-columns: repeat(3,1fr); gap:10px; }
  .stat-tile{
    background: var(--surface); border:1px solid var(--border); border-radius:16px;
    padding: 12px 8px; box-shadow: var(--shadow-1);
    display:flex; flex-direction:column; align-items:center; gap:6px; text-align:center;
  }
  .stat-icon{ width:30px; height:30px; border-radius:10px; display:flex; align-items:center; justify-content:center; }
  .stat-icon svg{ width:16px; height:16px; }
  .stat-value{ font-family:"Unbounded","Manrope",sans-serif; font-weight:700; font-size:17px; font-variant-numeric: tabular-nums; }
  .stat-value .stat-unit{ font-family:"Manrope",sans-serif; font-size:11px; font-weight:700; color: var(--text-muted); margin-left:2px; }
  .stat-label{ font-size:10.5px; color: var(--text-muted); font-weight:600; }

  .chart-card{
    background: var(--surface); border:1px solid var(--border); border-radius:20px;
    padding: 16px 14px; box-shadow: var(--shadow-1);
  }
  .chart-title{ font-size:14px; font-weight:700; margin-bottom:12px; }
  .chart-title-unit{ font-family:"Manrope",sans-serif; font-weight:600; font-size:11.5px; color: var(--text-muted); }

  .bar-chart-inner{ display:flex; gap:8px; }
  .bar-yaxis{
    flex:none; width:30px; height:120px;
    display:flex; flex-direction:column; justify-content:space-between; align-items:flex-end;
    padding-bottom: 1px;
  }
  .bar-yaxis span{ font-size:9.5px; color: var(--text-muted); font-variant-numeric: tabular-nums; }
  .bar-scroll{ flex:1; min-width:0; overflow-x:auto; }
  .bar-row{ display:flex; align-items:flex-end; gap:4px; height:120px; width:max-content; padding: 0 2px; }
  .bar-col{ display:flex; flex-direction:column; align-items:center; justify-content:flex-end; width:10px; height:100%; position:relative; }
  .bar-label{
    position:absolute; top:-16px; font-size:9px; font-weight:700; color: var(--bar-color, var(--blue));
    font-variant-numeric: tabular-nums; white-space:nowrap;
  }
  .bar{
    width:8px; border:none; border-radius:4px 4px 2px 2px;
    background: var(--bar-color, var(--blue));
    cursor:pointer; padding:0; flex:none;
  }
  .bar:disabled{ opacity:.25; cursor:default; }
  .bar-daylabel{ position:absolute; bottom:-15px; font-size:8.5px; color: var(--text-muted); }
  .bar-row.empty-flat{ width:100%; border-bottom:2px dashed var(--grid); }

  .chart-tooltip{
    position:fixed; z-index:60; pointer-events:none;
    background: var(--text-primary); color: var(--bg);
    font-size:11.5px; font-weight:700; font-variant-numeric: tabular-nums;
    padding:5px 9px; border-radius:8px; box-shadow: var(--shadow-2);
    transform: translate(-50%,-100%); white-space:nowrap;
  }
  .chart-tooltip[hidden]{ display:none; }

  .cal-header{ display:grid; grid-template-columns: repeat(7,1fr); margin-bottom:6px; }
  .cal-header span{ text-align:center; font-size:10.5px; color: var(--text-muted); font-weight:700; }
  .cal-grid{ display:grid; grid-template-columns: repeat(7,1fr); gap:4px; }
  .cal-cell{
    aspect-ratio:1; border-radius:10px; background: var(--surface-2);
    display:flex; flex-direction:column; align-items:center; justify-content:center; gap:2px;
    position:relative;
  }
  .cal-cell.empty{ background:transparent; }
  .cal-daynum{ font-size:10px; color: var(--text-muted); font-variant-numeric: tabular-nums; }
  .cal-cell.future .cal-daynum{ opacity:.35; }
  .cal-cell.done{ background: var(--aqua-bg); }
  .cal-cell.done .cal-daynum{ color: var(--aqua); font-weight:700; }
  .cal-dot{ width:7px; height:7px; border-radius:999px; background: var(--aqua); }

  .empty-note{ text-align:center; font-size:12px; color: var(--text-muted); padding: 10px 0 2px; }

  .table-section{ background: var(--surface); border:1px solid var(--border); border-radius:16px; overflow:hidden; box-shadow: var(--shadow-1); }
  .table-toggle{
    width:100%; display:flex; align-items:center; justify-content:center; gap:6px;
    border:none; background:transparent; color: var(--text-secondary);
    font-weight:700; font-size:12.5px; padding:13px; cursor:pointer;
  }
  .table-toggle svg{ width:13px; height:13px; transition: transform .2s ease; }
  .table-toggle.open svg{ transform: rotate(180deg); }
  .table-wrap{ border-top:1px solid var(--border); max-height:260px; overflow-y:auto; }
  .log-table{ width:100%; border-collapse:collapse; font-size:12.5px; }
  .log-table th{ position:sticky; top:0; background: var(--surface); text-align:left; color: var(--text-muted); font-size:10.5px; font-weight:700; padding:8px 12px; border-bottom:1px solid var(--border); }
  .log-table td{ padding:9px 12px; border-bottom:1px solid var(--border); color: var(--text-secondary); font-variant-numeric: tabular-nums; }
  .log-table tr:last-child td{ border-bottom:none; }
  .log-table tbody tr:not(.empty-row){ cursor:pointer; }
  .log-table tbody tr:not(.empty-row):active{ background: var(--surface-2); }
  .log-table td:first-child{ color: var(--text-primary); font-weight:700; }
  .empty-row td{ text-align:center; color: var(--text-muted); padding:18px 12px; }

  /* ---------- Bottom nav ---------- */
  .bottomnav{
    position:fixed; left:0; right:0; bottom:0; z-index:20;
    max-width:480px; margin:0 auto;
    display:flex;
    background: var(--surface);
    border-top:1px solid var(--border);
    padding: 6px 8px calc(6px + env(safe-area-inset-bottom, 0px));
    box-shadow: 0 -6px 20px -12px rgba(0,0,0,.2);
  }
  .nav-btn{
    flex:1; display:flex; flex-direction:column; align-items:center; gap:3px;
    border:none; background:transparent; color: var(--text-muted);
    padding: 7px 0; border-radius:12px; cursor:pointer;
  }
  .nav-btn svg{ width:21px; height:21px; }
  .nav-btn span{ font-size:10.5px; font-weight:700; }
  .nav-btn.active{ color: var(--accent); }

  .toast{
    position:fixed; top: calc(env(safe-area-inset-top,0px) + 70px); left:50%;
    transform: translateX(-50%) translateY(-6px);
    background: var(--text-primary); color: var(--bg);
    font-size:12.5px; font-weight:700; padding:8px 16px; border-radius:999px;
    box-shadow: var(--shadow-2); z-index:70; opacity:0; pointer-events:none;
    transition: opacity .2s ease, transform .2s ease;
    display:flex; align-items:center; gap:6px;
  }
  .toast svg{ width:13px; height:13px; }
  .toast.show{ opacity:1; transform: translateX(-50%) translateY(0); }
</style>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=Unbounded:wght@600;700;800&display=swap">
</head>
<body>

<div class="app">
  <header class="topbar">
    <div class="brand">
      <span class="brand-mark">
        <svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 17c3-1 3-7 6-8s3 6 6 5s3-6 6-6"/><circle cx="21" cy="8" r="1.6" fill="#fff" stroke="none"/></svg>
      </span>
      <div class="brand-text">
        <h1>오늘의 무브</h1>
        <p id="topSubtitle">매일 3가지 움직임 체크</p>
      </div>
    </div>
    <div class="streak-badge" id="streakBadge">
      <svg viewBox="0 0 24 24" fill="currentColor"><path d="M12.5 2.3c.7 2.4-1.7 3.6-2.6 5.4-.8 1.7-.6 3.2.5 4.2-1.6-.2-2.9-1.4-3.1-3C6 10.7 5 12.8 5 14.8 5 18.8 8.1 22 12 22s7-3.2 7-7.1c0-3.1-1.7-5.2-3.2-6.8.2 1.4-.2 2.3-1 2.9-.3-3.6-1.4-6.4-2.3-8.7z"/></svg>
      <span id="streakCount">0</span>
    </div>
  </header>

  <!-- ============ TODAY VIEW ============ -->
  <main class="view" id="view-today">
    <div class="date-nav">
      <button class="nav-arrow" id="dateBack" aria-label="이전 날짜">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 6l-6 6 6 6"/></svg>
      </button>
      <span class="date-label" id="dateLabel">오늘</span>
      <button class="nav-arrow" id="dateForward" aria-label="다음 날짜">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 6l6 6-6 6"/></svg>
      </button>
    </div>

    <div class="today-progress">
      <div class="progress-track"><div class="progress-fill" id="progressFill"></div></div>
      <span class="progress-text" id="progressText">0/3 완료</span>
    </div>

    <button class="today-jump" id="jumpToday" hidden>오늘로 이동</button>

    <!-- 걷기 · 달리기 -->
    <section class="card" id="cardDistance">
      <div class="card-head">
        <span class="icon-badge icon-blue">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M3 17c3-1 3-7 6-8s3 6 6 5s3-6 6-6" stroke-dasharray="2.2 3.4"/><circle cx="21" cy="8" r="1.7" fill="currentColor" stroke="none"/></svg>
        </span>
        <div class="card-title">
          <h3>걷기 · 달리기</h3>
          <p>오늘 이동한 거리</p>
        </div>
        <span class="done-badge" id="badgeDistance" hidden>
          <svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M4 12l5 5L20 6"/></svg>
        </span>
      </div>
      <div class="metric-row">
        <button class="stepper-btn" id="distMinus" aria-label="0.1km 감소">−</button>
        <div class="metric-display">
          <input class="metric-input" id="distInput" type="number" inputmode="decimal" step="0.1" min="0" max="200" value="0" aria-label="오늘 이동 거리 (km)">
          <span class="metric-unit">km</span>
        </div>
        <button class="stepper-btn" id="distPlus" aria-label="0.1km 증가">+</button>
      </div>
      <div class="chip-row">
        <button class="chip" data-target="dist" data-value="1">1km</button>
        <button class="chip" data-target="dist" data-value="3">3km</button>
        <button class="chip" data-target="dist" data-value="5">5km</button>
        <button class="chip" data-target="dist" data-value="10">10km</button>

    <!-- 매달리기 -->
    <section class="card" id="cardHang">
      <div class="card-head">
        <span class="icon-badge icon-orange">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><line x1="4" y1="5" x2="20" y2="5"/><line x1="15.5" y1="5" x2="15.5" y2="8.4" stroke-dasharray="1.6 2"/><line x1="8.5" y1="5" x2="8.5" y2="9.6"/><circle cx="8.5" cy="12" r="2.3"/><path d="M8.5 14.3v4.4"/><path d="M8.5 16.3l-2.3 2.8M8.5 16.3l2.3 2.8"/></svg>
        </span>
        <div class="card-title">
          <h3>매달리기</h3>
          <p>오늘 버틴 시간</p>
        </div>
        <span class="done-badge" id="badgeHang" hidden>
          <svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M4 12l5 5L20 6"/></svg>
        </span>
      </div>
      <div class="metric-row">
        <button class="stepper-btn" id="hangMinus" aria-label="5초 감소">−</button>
        <div class="metric-display">
          <input class="metric-input" id="hangInput" type="number" inputmode="numeric" step="5" min="0" max="1800" value="0" aria-label="오늘 매달리기 시간 (초)">
          <span class="metric-unit">초</span>
        </div>
        <button class="stepper-btn" id="hangPlus" aria-label="5초 증가">+</button>
      </div>
      <div class="chip-row">
        <button class="chip" data-target="hang" data-value="10">10초</button>
        <button class="chip" data-target="hang" data-value="30">30초</button>
        <button class="chip" data-target="hang" data-value="60">60초</button>
        <button class="chip" data-target="hang" data-value="90">90초</button>
      </div>
      <div class="timer-row">
        <button class="timer-btn" id="hangTimerBtn">
          <svg id="timerIconPlay" viewBox="0 0 24 24" fill="currentColor"><path d="M8 5v14l11-7z"/></svg>
          <svg id="timerIconStop" viewBox="0 0 24 24" fill="currentColor" hidden><rect x="6" y="6" width="12" height="12" rx="2"/></svg>
          <span id="timerBtnLabel">타이머로 측정</span>
        </button>
        <span class="timer-display" id="timerDisplay" hidden>00:00</span>
      </div>
    </section>

    <!-- 한발서기 -->
    <section class="card" id="cardBalance">
      <div class="card-head">
        <span class="icon-badge icon-aqua">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="4.6" r="2"/><path d="M12 6.6v6.5"/><path d="M12 8.6l-3.4 2"/><path d="M12 8.6l3.4-1"/><path d="M12 13.1v6.4"/><path d="M12 13.1c1.5 1.4 2 3.4 1.1 6.4"/></svg>
        </span>
        <div class="card-title">
          <h3>한발서기</h3>
          <p>10초 이상 버티면 완료</p>
        </div>
        <span class="done-badge" id="badgeBalance" hidden>
          <svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M4 12l5 5L20 6"/></svg>
        </span>
      </div>
      <div class="toggle-row">
        <div>
          <p class="toggle-label">오늘 한발서기 성공</p>
          <p class="card-sub">왼쪽 · 오른쪽 상관없이 체크하세요</p>
        </div>
        <button class="toggle-switch" id="balanceToggle" role="switch" aria-checked="false" aria-label="한발서기 완료 여부">
          <span class="toggle-knob"></span>
        </button>
      </div>
    </section>
  </main>

  <!-- ============ STATS VIEW ============ -->
  <main class="view" id="view-stats" hidden>
    <div class="month-nav">
      <button class="nav-arrow" id="monthBack" aria-label="이전 달">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 6l-6 6 6 6"/></svg>
      </button>
      <span class="month-label" id="monthLabel">2026년 9월</span>
      <button class="nav-arrow" id="monthForward" aria-label="다음 달">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 6l6 6-6 6"/></svg>
      </button>
    </div>

    <div class="stat-tiles">
      <div class="stat-tile">
        <span class="stat-icon icon-blue"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M3 17c3-1 3-7 6-8s3 6 6 5s3-6 6-6" stroke-dasharray="2 3"/></svg></span>
        <span class="stat-value"><span id="statKmTotal">0.0</span><span class="stat-unit">km</span></span>
        <span class="stat-label">총 이동거리</span>
      </div>
      <div class="stat-tile">
        <span class="stat-icon icon-orange"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><line x1="5" y1="5" x2="19" y2="5"/><line x1="12" y1="5" x2="12" y2="10"/><circle cx="12" cy="12.3" r="2.1"/></svg></span>
        <span class="stat-value"><span id="statHangBest">0</span><span class="stat-unit">초</span></span>
        <span class="stat-label">최고 매달리기</span>
      </div>
      <div class="stat-tile">
        <span class="stat-icon icon-aqua"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="5" r="1.8"/><path d="M12 6.8v5.6"/><path d="M12 12.4l4-6M12 8l-3.4 2M12 12.4v6.2"/></svg></span>
        <span class="stat-value"><span id="statBalanceDays">0</span><span class="stat-unit">일</span></span>
        <span class="stat-label">한발서기 성공</span>
      </div>
    </div>

    <section class="chart-card">
      <h3 class="chart-title">걷기 · 달리기 <span class="chart-title-unit">km / 일</span></h3>
      <div id="chartDistance"></div>
    </section>

    <section class="chart-card">
      <h3 class="chart-title">매달리기 <span class="chart-title-unit">초 / 일</span></h3>
      <div id="chartHang"></div>
    </section>

    <section class="chart-card">
      <h3 class="chart-title">한발서기 <span class="chart-title-unit">성공한 날</span></h3>
      <div id="calendarBalance"></div>
    </section>

    <section class="table-section">
      <button class="table-toggle" id="tableToggle">
        <span>이번 달 기록 표로 보기</span>
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 9l6 6 6-6"/></svg>
      </button>
      <div class="table-wrap" id="tableWrap" hidden>
        <table class="log-table">
          <thead><tr><th>날짜</th><th>거리</th><th>매달리기</th><th>한발서기</th></tr></thead>
          <tbody id="logTableBody"></tbody>
        </table>
      </div>
    </section>
  </main>

  <nav class="bottomnav">
    <button class="nav-btn active" id="navToday" data-view="today">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 6.2l1.6 1.6L8.2 5"/><line x1="11.4" y1="6.2" x2="20" y2="6.2"/><path d="M4 12.2l1.6 1.6l2.6-2.8"/><line x1="11.4" y1="12.2" x2="20" y2="12.2"/><path d="M4 18.2l1.6 1.6l2.6-2.8"/><line x1="11.4" y1="18.2" x2="20" y2="18.2"/></svg>
      <span>오늘</span>
    </button>
    <button class="nav-btn" id="navStats" data-view="stats">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><line x1="5" y1="19" x2="5" y2="11"/><line x1="12" y1="19" x2="12" y2="6"/><line x1="19" y1="19" x2="19" y2="14"/></svg>
      <span>통계</span>
    </button>
  </nav>
</div>

<div class="chart-tooltip" id="chartTooltip" hidden></div>
<div class="toast" id="toast">
  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M4 12l5 5L20 6"/></svg>
  <span>저장됨</span>
</div>

<script>
(function(){
  "use strict";

  var STORAGE_KEY = "moveLogV1";
  var WEEKDAYS = ["일","월","화","수","목","금","토"];
  var CHART_H = 120;

  function loadLogs(){
    try{
      var raw = localStorage.getItem(STORAGE_KEY);
      return raw ? JSON.parse(raw) : {};
    }catch(e){ return {}; }
  }
  function saveLogs(){
    try{ localStorage.setItem(STORAGE_KEY, JSON.stringify(logs)); }catch(e){}
  }

  var logs = loadLogs();
  var today = new Date();
  var selectedDate = new Date();
  var statsMonth = new Date(today.getFullYear(), today.getMonth(), 1);
  var timerInterval = null;
  var timerStart = null;
  var toastTimeout = null;

  function pad(n){ return n < 10 ? "0" + n : "" + n; }
  function dateKey(d){ return d.getFullYear() + "-" + pad(d.getMonth()+1) + "-" + pad(d.getDate()); }
  function sameDay(a,b){ return dateKey(a) === dateKey(b); }
  function stripTime(d){ return new Date(d.getFullYear(), d.getMonth(), d.getDate()); }
  function isFuture(d){ return stripTime(d).getTime() > stripTime(today).getTime(); }
  function getEntry(key){
    var e = logs[key];
    return e ? e : { km:0, hangSec:0, balance:false };
  }
  function commitEntry(key, patch){
    var cur = logs[key] ? logs[key] : { km:0, hangSec:0, balance:false };
    var next = { km: cur.km, hangSec: cur.hangSec, balance: cur.balance };
    for(var k in patch){ next[k] = patch[k]; }
    if(next.km <= 0 && next.hangSec <= 0 && !next.balance){
      delete logs[key];
    } else {
      logs[key] = next;
    }
    saveLogs();
    showToast();
  }

  function showToast(){
    var el = document.getElementById("toast");
    el.classList.add("show");
    if(toastTimeout) clearTimeout(toastTimeout);
    toastTimeout = setTimeout(function(){ el.classList.remove("show"); }, 1100);
  }

  /* ---------------- Today view ---------------- */
  var distInput = document.getElementById("distInput");
  var hangInput = document.getElementById("hangInput");
  var balanceToggle = document.getElementById("balanceToggle");

  function renderToday(){
    var key = dateKey(selectedDate);
    var entry = getEntry(key);
    var isToday = sameDay(selectedDate, today);

    document.getElementById("dateLabel").textContent =
      (isToday ? "오늘 · " : "") + (selectedDate.getMonth()+1) + "월 " + selectedDate.getDate() + "일 (" + WEEKDAYS[selectedDate.getDay()] + ")";
    document.getElementById("jumpToday").hidden = isToday;
    document.getElementById("dateForward").disabled = isToday;

    distInput.value = entry.km.toFixed(1);
    hangInput.value = Math.round(entry.hangSec);

    document.getElementById("badgeDistance").hidden = !(entry.km > 0);
    document.getElementById("badgeHang").hidden = !(entry.hangSec > 0);
    document.getElementById("badgeBalance").hidden = !entry.balance;

    balanceToggle.classList.toggle("on", !!entry.balance);
    balanceToggle.setAttribute("aria-checked", entry.balance ? "true" : "false");

    var doneCount = (entry.km > 0 ? 1 : 0) + (entry.hangSec > 0 ? 1 : 0) + (entry.balance ? 1 : 0);
    document.getElementById("progressFill").style.width = (doneCount / 3 * 100) + "%";
    document.getElementById("progressText").textContent = doneCount + "/3 완료";

    stopTimerUI();
    updateStreakBadge();
  }

  function clampDist(v){ if(isNaN(v)) v = 0; return Math.max(0, Math.min(200, Math.round(v*10)/10)); }
  function clampHang(v){ if(isNaN(v)) v = 0; return Math.max(0, Math.min(1800, Math.round(v))); }

  document.getElementById("dateBack").addEventListener("click", function(){
    selectedDate.setDate(selectedDate.getDate() - 1);
    renderToday();
  });
  document.getElementById("dateForward").addEventListener("click", function(){
    if(sameDay(selectedDate, today)) return;
    selectedDate.setDate(selectedDate.getDate() + 1);
    renderToday();
  });
  document.getElementById("jumpToday").addEventListener("click", function(){
    selectedDate = new Date();
    renderToday();
  });

  document.getElementById("distMinus").addEventListener("click", function(){
    var v = clampDist(parseFloat(distInput.value) - 0.1);
    distInput.value = v.toFixed(1);
    commitEntry(dateKey(selectedDate), { km: v });
    renderToday();
  });
  document.getElementById("distPlus").addEventListener("click", function(){
    var v = clampDist(parseFloat(distInput.value) + 0.1);
    distInput.value = v.toFixed(1);
    commitEntry(dateKey(selectedDate), { km: v });
    renderToday();
  });
  distInput.addEventListener("change", function(){
    var v = clampDist(parseFloat(distInput.value));
    commitEntry(dateKey(selectedDate), { km: v });
    renderToday();
  });

  document.getElementById("hangMinus").addEventListener("click", function(){
    var v = clampHang(parseFloat(hangInput.value) - 5);
    hangInput.value = v;
    commitEntry(dateKey(selectedDate), { hangSec: v });
    renderToday();
  });
  document.getElementById("hangPlus").addEventListener("click", function(){
    var v = clampHang(parseFloat(hangInput.value) + 5);
    hangInput.value = v;
    commitEntry(dateKey(selectedDate), { hangSec: v });
    renderToday();
  });
  hangInput.addEventListener("change", function(){
    var v = clampHang(parseFloat(hangInput.value));
    commitEntry(dateKey(selectedDate), { hangSec: v });
    renderToday();
  });

  Array.prototype.forEach.call(document.querySelectorAll(".chip"), function(chip){
    chip.addEventListener("click", function(){
      var target = chip.getAttribute("data-target");
      var val = parseFloat(chip.getAttribute("data-value"));
      if(target === "dist"){
        commitEntry(dateKey(selectedDate), { km: val });
      } else {
        commitEntry(dateKey(selectedDate), { hangSec: val });
      }
      renderToday();
    });
  });

  balanceToggle.addEventListener("click", function(){
    var entry = getEntry(dateKey(selectedDate));
    commitEntry(dateKey(selectedDate), { balance: !entry.balance });
    renderToday();
  });

  /* Timer for 매달리기 */
  function stopTimerUI(){
    if(timerInterval){ clearInterval(timerInterval); timerInterval = null; }
    timerStart = null;
    document.getElementById("hangTimerBtn").classList.remove("running");
    document.getElementById("timerBtnLabel").textContent = "타이머로 측정";
    document.getElementById("timerIconPlay").hidden = false;
    document.getElementById("timerIconStop").hidden = true;
    document.getElementById("timerDisplay").hidden = true;
  }
  function timerTick(){
    var elapsed = Math.floor((Date.now() - timerStart) / 1000);
    var m = Math.floor(elapsed / 60), s = elapsed % 60;
    document.getElementById("timerDisplay").textContent = pad(m) + ":" + pad(s);
  }
  document.getElementById("hangTimerBtn").addEventListener("click", function(){
    if(timerInterval){
      var elapsed = clampHang(Math.floor((Date.now() - timerStart) / 1000));
      stopTimerUI();
      hangInput.value = elapsed;
      commitEntry(dateKey(selectedDate), { hangSec: elapsed });
      renderToday();
    } else {
      timerStart = Date.now();
      document.getElementById("hangTimerBtn").classList.add("running");
      document.getElementById("timerBtnLabel").textContent = "정지하고 저장";
      document.getElementById("timerIconPlay").hidden = true;
      document.getElementById("timerIconStop").hidden = false;
      document.getElementById("timerDisplay").hidden = false;
      timerTick();
      timerInterval = setInterval(timerTick, 250);
    }
  });

  function calcStreak(){
    var d = new Date(today);
    function complete(dt){
      var e = logs[dateKey(dt)];
      return !!(e && e.km > 0 && e.hangSec > 0 && e.balance);
    }
    if(!complete(d)) d.setDate(d.getDate() - 1);
    var streak = 0;
    while(complete(d)){ streak++; d.setDate(d.getDate() - 1); }
    return streak;
  }
  function updateStreakBadge(){
    var s = calcStreak();
    document.getElementById("streakCount").textContent = s;
    document.getElementById("streakBadge").classList.toggle("active", s > 0);
  }

  /* ---------------- Stats view ---------------- */
  function renderBarChart(containerId, values, opts){
    var container = document.getElementById(containerId);
    var max = 0;
    for(var i=0;i<values.length;i++){ if(values[i] > max) max = values[i]; }

    if(max === 0){
      container.innerHTML =
        '<div class="bar-chart-inner" style="--bar-color:' + opts.color + '">' +
          '<div class="bar-yaxis" style="justify-content:flex-end"><span>0</span></div>' +
          '<div class="bar-scroll"><div class="bar-row empty-flat"></div></div>' +
        '</div>' +
        '<p class="empty-note">아직 기록이 없어요. 오늘 탭에서 기록해보세요!</p>';
      return;
    }

    var maxLabel = opts.decimals ? max.toFixed(1) : String(Math.round(max));
    var midLabel = opts.decimals ? (max/2).toFixed(1) : String(Math.round(max/2));

    var cols = "";
    for(var d=0; d<values.length; d++){
      var v = values[d];
      var dayNum = d + 1;
      var h = max > 0 ? Math.max(v / max * CHART_H, v > 0 ? 6 : 1) : 1;
      var isMax = max > 0 && v === max;
      var disabled = opts.disabledFrom && dayNum > opts.disabledFrom;
      var valLabel = opts.decimals ? v.toFixed(1) : String(Math.round(v));
      cols += '<div class="bar-col">' +
        (isMax ? '<span class="bar-label">' + valLabel + '</span>' : '') +
        '<button class="bar"' + (disabled ? ' disabled' : '') + ' style="height:' + h.toFixed(1) + 'px" data-day="' + dayNum + '" data-value="' + valLabel + opts.unit + '"></button>' +
        '<span class="bar-daylabel">' + ((dayNum === 1 || dayNum % 5 === 0) ? dayNum : "") + '</span>' +
        '</div>';
    }

    container.innerHTML =
      '<div class="bar-chart-inner" style="--bar-color:' + opts.color + '">' +
        '<div class="bar-yaxis"><span>' + maxLabel + '</span><span>' + midLabel + '</span><span>0</span></div>' +
        '<div class="bar-scroll"><div class="bar-row">' + cols + '</div></div>' +
      '</div>';

    var tooltip = document.getElementById("chartTooltip");
    Array.prototype.forEach.call(container.querySelectorAll(".bar:not(:disabled)"), function(bar){
      bar.addEventListener("click", function(){
        var rect = bar.getBoundingClientRect();
        tooltip.textContent = opts.monthLabel + " " + bar.getAttribute("data-day") + "일 · " + bar.getAttribute("data-value");
        tooltip.style.left = (rect.left + rect.width/2) + "px";
        tooltip.style.top = (rect.top - 8) + "px";
        tooltip.hidden = false;
        clearTimeout(tooltip._t);
        tooltip._t = setTimeout(function(){ tooltip.hidden = true; }, 1600);
      });
    });
  }

  function renderCalendar(year, month, balanceByDay, isCurrentMonth){
    var first = new Date(year, month, 1);
    var startWeekday = first.getDay();
    var daysInMonth = new Date(year, month+1, 0).getDate();
    var header = WEEKDAYS.map(function(w){ return '<span>' + w + '</span>'; }).join("");
    var cells = "";
    for(var i=0;i<startWeekday;i++){ cells += '<span class="cal-cell empty"></span>'; }
    for(var d=1; d<=daysInMonth; d++){
      var future = isCurrentMonth && d > today.getDate();
      var done = !!balanceByDay[d-1];
      var cls = "cal-cell" + (future ? " future" : "") + (done ? " done" : "");
      cells += '<span class="' + cls + '"><span class="cal-daynum">' + d + '</span>' + (done ? '<span class="cal-dot"></span>' : "") + '</span>';
    }
    document.getElementById("calendarBalance").innerHTML =
      '<div class="cal-header">' + header + '</div><div class="cal-grid">' + cells + '</div>';
  }

  function renderTable(year, month){
    var body = document.getElementById("logTableBody");
    var daysInMonth = new Date(year, month+1, 0).getDate();
    var rows = [];
    for(var d=daysInMonth; d>=1; d--){
      var key = year + "-" + pad(month+1) + "-" + pad(d);
      var e = logs[key];
      if(!e) continue;
      rows.push('<tr data-key="' + key + '"><td>' + (month+1) + '/' + d + '</td><td>' + e.km.toFixed(1) + 'km</td><td>' + Math.round(e.hangSec) + '초</td><td>' + (e.balance ? "성공" : "—") + '</td></tr>');
    }
    body.innerHTML = rows.length ? rows.join("") : '<tr class="empty-row"><td colspan="4">이번 달 기록이 없어요</td></tr>';
    Array.prototype.forEach.call(body.querySelectorAll("tr[data-key]"), function(row){
      row.addEventListener("click", function(){
        var parts = row.getAttribute("data-key").split("-");
        selectedDate = new Date(parseInt(parts[0],10), parseInt(parts[1],10)-1, parseInt(parts[2],10));
        switchView("today");
        renderToday();
      });
    });
  }

  function renderStats(){
    var year = statsMonth.getFullYear();
    var month = statsMonth.getMonth();
    var isCurrentMonth = (year === today.getFullYear() && month === today.getMonth());
    var daysInMonth = new Date(year, month+1, 0).getDate();

    document.getElementById("monthLabel").textContent = year + "년 " + (month+1) + "월";
    document.getElementById("monthForward").disabled = isCurrentMonth;

    var kmByDay = [], hangByDay = [], balByDay = [];
    var totalKm = 0, bestHang = 0, balDays = 0;
    for(var d=1; d<=daysInMonth; d++){
      var key = year + "-" + pad(month+1) + "-" + pad(d);
      var e = logs[key];
      var km = e ? e.km : 0;
      var hang = e ? e.hangSec : 0;
      var bal = e ? !!e.balance : false;
      kmByDay.push(km); hangByDay.push(hang); balByDay.push(bal);
      totalKm += km;
      if(hang > bestHang) bestHang = hang;
      if(bal) balDays++;
    }

    document.getElementById("statKmTotal").textContent = totalKm.toFixed(1);
    document.getElementById("statHangBest").textContent = Math.round(bestHang);
    document.getElementById("statBalanceDays").textContent = balDays;

    var disabledFrom = isCurrentMonth ? today.getDate() : null;
    var mLabel = (month+1) + "월";
    renderBarChart("chartDistance", kmByDay, { color: "var(--blue)", unit: "km", decimals: true, disabledFrom: disabledFrom, monthLabel: mLabel });
    renderBarChart("chartHang", hangByDay, { color: "var(--orange)", unit: "초", decimals: false, disabledFrom: disabledFrom, monthLabel: mLabel });
    renderCalendar(year, month, balByDay, isCurrentMonth);
    renderTable(year, month);
  }

  document.getElementById("monthBack").addEventListener("click", function(){
    statsMonth.setMonth(statsMonth.getMonth() - 1);
    renderStats();
  });
  document.getElementById("monthForward").addEventListener("click", function(){
    if(statsMonth.getFullYear() === today.getFullYear() && statsMonth.getMonth() === today.getMonth()) return;
    statsMonth.setMonth(statsMonth.getMonth() + 1);
    renderStats();
  });

  document.getElementById("tableToggle").addEventListener("click", function(){
    var wrap = document.getElementById("tableWrap");
    wrap.hidden = !wrap.hidden;
    this.classList.toggle("open", !wrap.hidden);
  });

  /* ---------------- Tab navigation ---------------- */
  function switchView(name){
    document.getElementById("view-today").hidden = (name !== "today");
    document.getElementById("view-stats").hidden = (name !== "stats");
    document.getElementById("navToday").classList.toggle("active", name === "today");
    document.getElementById("navStats").classList.toggle("active", name === "stats");
    if(name === "stats") renderStats();
  }
  document.getElementById("navToday").addEventListener("click", function(){ switchView("today"); });
  document.getElementById("navStats").addEventListener("click", function(){ switchView("stats"); });

  renderToday();
})();
</script>
</body>
</html>
